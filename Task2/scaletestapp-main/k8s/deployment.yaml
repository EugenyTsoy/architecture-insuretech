apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalable-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scalable-app
  template:
    metadata:
      labels:
        app: scalable-app
    spec:
      containers:
      - name: app
        image: app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080 
        resources:
          limits:
            memory: "30Mi"
          requests:
            memory: "30Mi"